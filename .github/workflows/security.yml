name: SDK Security
on: [push, pull_request]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and run Gitleaks
        shell: bash
        run: |
          scan_tools=$(mktemp -d)
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$scan_tools/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt -o "$scan_tools/checksums.txt"
          (cd "$scan_tools" && sha256sum --check --ignore-missing checksums.txt)
          tar -xzf "$scan_tools/gitleaks_8.30.1_linux_x64.tar.gz" -C "$scan_tools" gitleaks
          "$scan_tools/gitleaks" git --redact --no-banner .
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --prefer-dist --no-interaction
      - run: composer audit
      - run: php tools/check-licenses.php
      - run: composer licenses --format=json > dependency-licenses.json
      - run: php tools/sbom.php > dependency-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: locked-dependency-evidence
          path: |
            dependency-licenses.json
            dependency-sbom.cdx.json
  keycloak-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          image-ref: quay.io/keycloak/keycloak:26.8.2
          format: json
          output: keycloak-vulnerabilities.json
          severity: CRITICAL,HIGH
          exit-code: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keycloak-container-security
          path: keycloak-vulnerabilities.json
